name: Build deb

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Theos and iOS SDKs
        run: |
          set -euo pipefail
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          ls -la "$THEOS" | head -20
          ls -la "$THEOS/makefiles" | head -10
          mkdir -p "$THEOS/sdks"
          curl -L -o /tmp/sdks.tar.gz https://github.com/theos/sdks/archive/refs/heads/master.tar.gz
          tar xzf /tmp/sdks.tar.gz -C /tmp
          cp -R /tmp/sdks-master/*.sdk "$THEOS/sdks/"
          ls "$THEOS/sdks"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Toolchain diagnostics
        run: |
          echo "THEOS=$THEOS"
          ls "$THEOS/bin" | head -20
          make --version | head -2
          clang --version | head -2
          xcodebuild -version
          echo "--- sdks ---"
          ls "$THEOS/sdks"

      - name: Build rootless deb (arm64 + arm64e)
        run: |
          set -x
          set -o pipefail
          export THEOS_PACKAGE_SCHEME=rootless
          make package FINALPACKAGE=1 2>&1 | tee /tmp/build.log

      - name: Show build log and packages dir
        if: always()
        run: |
          echo "=== packages dir ==="
          ls -la packages || echo "no packages directory"
          echo "=== last 200 lines of build log ==="
          tail -200 /tmp/build.log || true

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: StayLowPowerMode-deb
          path: packages/*.deb
          if-no-files-found: error
